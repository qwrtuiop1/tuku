# 前端Nginx配置 - tukufrontend.vtart.cn
server {
    listen 80;
    listen 443 ssl http2;
    server_name tukufrontend.vtart.cn;
    
    # SSL配置
    ssl_certificate /path/to/your/certificate.crt;
    ssl_certificate_key /path/to/your/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # 网站根目录
    root /www/wwwroot/tukufrontend;
    index index.html;
    
    # 处理Vue Router的history模式
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 实况媒体直出（封面与视频）
    location ~* \.(mp4|webm)$ {
        add_header Accept-Ranges bytes always;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }
    location ~* \.(webp|jpg|jpeg)$ {
        expires 90d;
        add_header Cache-Control "public, max-age=7776000";
        try_files $uri =404;
    }
    
    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 严格CSP（仅允许本域脚本 + GeeTest 脚本），阻断外部注入
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; connect-src 'self' https://tukubackend.vtart.cn https://static.geetest.com https://gcaptcha4.geetest.com; script-src 'self' https://static.geetest.com; script-src-elem 'self' https://static.geetest.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self' data: https:; frame-src 'self' https://static.geetest.com https://gcaptcha4.geetest.com" always;
    
    # 日志
    access_log /var/log/nginx/tukufrontend_access.log;
    error_log /var/log/nginx/tukufrontend_error.log;
}







