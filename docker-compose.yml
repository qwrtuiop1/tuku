version: '3.8'

services:
  # 后端服务
  backend:
    build: ./backend
    container_name: tuku-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_HOST: 134.175.220.243
      DB_USER: tuku
      DB_PASSWORD: RHd5biyaXmaAbyDC
      DB_NAME: tuku
      JWT_SECRET: your-production-jwt-secret-key
      JWT_EXPIRES_IN: 7d
      PORT: 3000
      UPLOAD_PATH: /app/storage
      GEETEST_CAPTCHA_ID: 30d77075542cc161d6518051a937b9a0
      GEETEST_CAPTCHA_KEY: adf04d6e0ab935085653526be97a92e6
      GEETEST_OFFLINE_ALLOW: "true"
    volumes:
      - backend_storage:/app/storage
    networks:
      - tuku-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`tukubackend.vtart.cn`)"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.backend-maxbody.maxbody=2147483648"
      - "traefik.http.routers.backend.middlewares=backend-maxbody"

  # 前端服务
  frontend:
    build: ./frontend
    container_name: tuku-frontend
    restart: unless-stopped
    networks:
      - tuku-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`tukufrontend.vtart.cn`)"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

volumes:
  backend_storage:

networks:
  tuku-network:
    driver: bridge








